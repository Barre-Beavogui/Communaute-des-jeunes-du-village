openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: profiles
    description: Community member profiles
  - name: moderation
    description: Admin moderation operations
  - name: membership
    description: Public membership requests
  - name: admin
    description: Administrator authentication
  - name: community
    description: Announcements, likes, polls, and member voting
  - name: member
    description: Community member authentication
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /profiles:
    get:
      operationId: listProfiles
      tags: [profiles]
      summary: List approved community profiles
      responses:
        "200":
          description: Approved profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Profile"
  /profiles/{id}:
    get:
      operationId: getProfile
      tags: [profiles]
      summary: Get a profile by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "404":
          description: Profile not found
  /members/summary:
    get:
      operationId: getMembersSummary
      tags: [profiles]
      summary: Get lightweight community summary
      responses:
        "200":
          description: Community summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembersSummary"
  /membership-requests:
    post:
      operationId: createMembershipRequest
      tags: [membership]
      summary: Submit a membership request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MembershipRequestCreate"
      responses:
        "201":
          description: Membership request submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipRequestReceipt"
  /admin/login:
    post:
      operationId: adminLogin
      tags: [admin]
      summary: Open an administrator session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLogin"
      responses:
        "200":
          description: Administrator session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
        "401":
          description: Invalid password
  /member/login:
    post:
      operationId: memberLogin
      tags: [member]
      summary: Open a member session with an email or phone and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberLogin"
      responses:
        "200":
          description: Member session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberSession"
        "401":
          description: Invalid member credentials
  /member/activate:
    post:
      operationId: memberActivate
      tags: [member]
      summary: Start first-login activation with a personal code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberActivation"
      responses:
        "200":
          description: First-login session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberSession"
        "401":
          description: Invalid personal code
  /member/set-password:
    post:
      operationId: setMemberPassword
      tags: [member]
      summary: Set a member password during first login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberPasswordSetup"
      responses:
        "200":
          description: Password created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberPasswordSetupReceipt"
        "401":
          description: First-login session required
  /member/password-reset-requests:
    post:
      operationId: requestMemberPasswordReset
      tags: [member]
      summary: Request help resetting a forgotten member password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberPasswordResetRequestCreate"
      responses:
        "202":
          description: Request accepted without revealing whether the account exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberPasswordResetRequestReceipt"
  /member/profile:
    get:
      operationId: getMemberProfileSettings
      tags: [member]
      summary: Get the connected member profile settings
      responses:
        "200":
          description: Member profile settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberProfileSettings"
        "401":
          description: Member session required
    patch:
      operationId: updateMemberProfile
      tags: [member]
      summary: Update the connected member profile and contact visibility
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberProfileUpdate"
      responses:
        "200":
          description: Updated member profile settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberProfileSettings"
        "401":
          description: Member session required
        "409":
          description: Email or phone already used
  /announcements:
    get:
      operationId: listAnnouncements
      tags: [community]
      summary: List community announcements
      responses:
        "200":
          description: Community announcements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Announcement"
  /announcements/{id}/like:
    post:
      operationId: toggleAnnouncementLike
      tags: [community]
      summary: Like or unlike an announcement as a member
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Updated like state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnnouncementReaction"
        "401":
          description: Member session required
  /announcements/{id}/dislike:
    post:
      operationId: toggleAnnouncementDislike
      tags: [community]
      summary: Dislike or remove a dislike from an announcement as a member
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Updated reaction state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnnouncementReaction"
        "401":
          description: Member session required
  /polls:
    get:
      operationId: listPolls
      tags: [community]
      summary: List community polls
      responses:
        "200":
          description: Community polls
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Poll"
  /polls/{id}/vote:
    post:
      operationId: votePoll
      tags: [community]
      summary: Vote in a poll as a member
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PollVote"
      responses:
        "200":
          description: Updated poll
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Poll"
        "401":
          description: Member session required
  /moderation/requests:
    get:
      operationId: listModerationRequests
      tags: [moderation]
      summary: List pending membership requests
      responses:
        "200":
          description: Pending requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MembershipRequest"
  /moderation/requests/{id}:
    patch:
      operationId: reviewModerationRequest
      tags: [moderation]
      summary: Approve or reject a membership request
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModerationReview"
      responses:
        "200":
          description: Reviewed request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipRequest"
  /moderation/password-reset-requests:
    get:
      operationId: listPasswordResetRequests
      tags: [moderation]
      summary: List pending member password reset requests
      responses:
        "200":
          description: Pending password reset requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MemberPasswordResetRequest"
  /moderation/password-reset-requests/{id}/code:
    post:
      operationId: createPasswordResetCode
      tags: [moderation]
      summary: Generate a new activation code for a password reset request
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Password reset invitation details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberPasswordResetCode"
        "404":
          description: Request not found
  /moderation/profiles/{id}:
    delete:
      operationId: deleteModerationProfile
      tags: [moderation]
      summary: Permanently remove a community profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Profile removed
        "404":
          description: Profile not found
  /moderation/profiles/{id}/member-code:
    post:
      operationId: generateMemberCode
      tags: [moderation]
      summary: Create or replace a member personal code
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberContactUpdate"
      responses:
        "200":
          description: Newly generated personal code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberCode"
        "404":
          description: Profile not found
  /moderation/announcements:
    post:
      operationId: createAnnouncement
      tags: [moderation]
      summary: Publish an announcement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnnouncementCreate"
      responses:
        "201":
          description: Published announcement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Announcement"
  /moderation/announcements/{id}:
    delete:
      operationId: deleteAnnouncement
      tags: [moderation]
      summary: Delete an announcement
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Announcement removed
        "404":
          description: Announcement not found
  /moderation/polls:
    post:
      operationId: createPoll
      tags: [moderation]
      summary: Create a poll
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PollCreate"
      responses:
        "201":
          description: Created poll
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Poll"
  /moderation/polls/{id}:
    patch:
      operationId: updatePollStatus
      tags: [moderation]
      summary: Open or close a poll
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PollStatusUpdate"
      responses:
        "200":
          description: Updated poll
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Poll"
    delete:
      operationId: deletePoll
      tags: [moderation]
      summary: Delete a poll
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Poll removed
        "404":
          description: Poll not found
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Profile:
      type: object
      required:
        [id, name, initials, neighborhood, bio, activities, privacy, status]
      properties:
        id: { type: string }
        name: { type: string }
        initials: { type: string }
        neighborhood: { type: string }
        avatarUrl: { type: ["string", "null"] }
        bio: { type: string }
        activities:
          type: array
          items: { type: string }
        project: { type: ["string", "null"] }
        contact: { type: ["string", "null"] }
        email: { type: ["string", "null"] }
        phone: { type: ["string", "null"] }
        instagram: { type: ["string", "null"] }
        privacy:
          type: string
          enum: [community, private]
        status:
          type: string
          enum: [approved, pending]
    MembersSummary:
      type: object
      required: [totalMembers, activeProjects, topActivities]
      properties:
        totalMembers: { type: number }
        activeProjects: { type: number }
        topActivities:
          type: array
          items:
            type: object
            required: [label, count]
            properties:
              label: { type: string }
              count: { type: number }
    MembershipRequest:
      type: object
      required:
        [id, name, email, neighborhood, profession, bio, submittedAt, status]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        phone: { type: ["string", "null"] }
        avatarUrl: { type: ["string", "null"], maxLength: 500000 }
        neighborhood: { type: string }
        profession: { type: string }
        bio: { type: string }
        project: { type: ["string", "null"] }
        submittedAt: { type: string }
        status:
          type: string
          enum: [pending, approved, rejected]
        memberCode: { type: ["string", "null"] }
    MembershipRequestCreate:
      type: object
      required: [name, email, neighborhood, profession, bio]
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        email: { type: string, maxLength: 254 }
        phone: { type: ["string", "null"], maxLength: 40 }
        avatarUrl: { type: ["string", "null"], maxLength: 500000 }
        neighborhood: { type: string, minLength: 2, maxLength: 120 }
        profession: { type: string, minLength: 2, maxLength: 80 }
        bio: { type: string, minLength: 10, maxLength: 500 }
        project: { type: ["string", "null"], maxLength: 500 }
    MembershipRequestReceipt:
      type: object
      required: [id, submittedAt, status]
      properties:
        id: { type: string }
        submittedAt: { type: string }
        status:
          type: string
          enum: [pending]
    AdminLogin:
      type: object
      required: [password]
      properties:
        password: { type: string, minLength: 1, maxLength: 200 }
    AdminSession:
      type: object
      required: [token, expiresAt]
      properties:
        token: { type: string }
        expiresAt: { type: string }
    ModerationReview:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [approved, rejected]
    MemberLogin:
      type: object
      required: [identifier, password]
      properties:
        identifier: { type: string, minLength: 5, maxLength: 254 }
        password: { type: string, minLength: 8, maxLength: 128 }
    MemberActivation:
      type: object
      required: [code]
      properties:
        code: { type: string, minLength: 8, maxLength: 32 }
    MemberIdentity:
      type: object
      required: [id, name, initials]
      properties:
        id: { type: string }
        name: { type: string }
        initials: { type: string }
        avatarUrl: { type: ["string", "null"] }
    MemberSession:
      type: object
      required: [token, expiresAt, profile, requiresPasswordChange]
      properties:
        token: { type: string }
        expiresAt: { type: string }
        requiresPasswordChange: { type: boolean }
        profile:
          $ref: "#/components/schemas/MemberIdentity"
    MemberPasswordSetup:
      type: object
      required: [password]
      properties:
        password: { type: string, minLength: 8, maxLength: 128 }
    MemberPasswordSetupReceipt:
      type: object
      required: [success]
      properties:
        success: { type: boolean, enum: [true] }
    MemberPasswordResetRequestCreate:
      type: object
      required: [identifier]
      properties:
        identifier: { type: string, minLength: 5, maxLength: 254 }
    MemberPasswordResetRequestReceipt:
      type: object
      required: [success]
      properties:
        success: { type: boolean, enum: [true] }
    MemberPasswordResetRequest:
      type: object
      required: [id, profileId, memberName, requestedAt]
      properties:
        id: { type: string }
        profileId: { type: string }
        memberName: { type: string }
        email: { type: ["string", "null"] }
        phone: { type: ["string", "null"] }
        requestedAt: { type: string }
    MemberPasswordResetCode:
      type: object
      required: [code, createdAt, memberName]
      properties:
        code: { type: string }
        createdAt: { type: string }
        memberName: { type: string }
        email: { type: ["string", "null"] }
        phone: { type: ["string", "null"] }
    MemberProfileSettings:
      type: object
      required:
        [
          id,
          name,
          initials,
          neighborhood,
          bio,
          profession,
          showEmail,
          showPhone,
        ]
      properties:
        id: { type: string }
        name: { type: string }
        initials: { type: string }
        avatarUrl: { type: ["string", "null"], maxLength: 500000 }
        neighborhood: { type: string }
        bio: { type: string }
        profession: { type: string }
        project: { type: ["string", "null"] }
        email: { type: ["string", "null"] }
        phone: { type: ["string", "null"] }
        showEmail: { type: boolean }
        showPhone: { type: boolean }
    MemberProfileUpdate:
      type: object
      required: [name, neighborhood, bio, profession, showEmail, showPhone]
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        avatarUrl: { type: ["string", "null"], maxLength: 500000 }
        neighborhood: { type: string, minLength: 2, maxLength: 120 }
        bio: { type: string, minLength: 10, maxLength: 500 }
        profession: { type: string, minLength: 2, maxLength: 80 }
        project: { type: ["string", "null"], maxLength: 500 }
        email: { type: ["string", "null"], maxLength: 254 }
        phone: { type: ["string", "null"], maxLength: 40 }
        showEmail: { type: boolean }
        showPhone: { type: boolean }
    MemberCode:
      type: object
      required: [code, createdAt]
      properties:
        code: { type: string }
        createdAt: { type: string }
    MemberContactUpdate:
      type: object
      properties:
        email: { type: ["string", "null"], maxLength: 254 }
        phone: { type: ["string", "null"], maxLength: 40 }
    Announcement:
      type: object
      required:
        [
          id,
          title,
          content,
          createdAt,
          likeCount,
          dislikeCount,
          likedByMember,
          dislikedByMember,
        ]
      properties:
        id: { type: string }
        title: { type: string }
        content: { type: string }
        mediaType:
          type: ["string", "null"]
          enum: [image, video, null]
        mediaUrl: { type: ["string", "null"] }
        createdAt: { type: string }
        likeCount: { type: number }
        dislikeCount: { type: number }
        likedByMember: { type: boolean }
        dislikedByMember: { type: boolean }
    AnnouncementCreate:
      type: object
      required: [title, content]
      properties:
        title: { type: string, minLength: 3, maxLength: 120 }
        content: { type: string, minLength: 3, maxLength: 3000 }
        mediaType:
          type: ["string", "null"]
          enum: [image, video, null]
        mediaUrl: { type: ["string", "null"], maxLength: 500000 }
    AnnouncementReaction:
      type: object
      required: [liked, disliked, likeCount, dislikeCount]
      properties:
        liked: { type: boolean }
        disliked: { type: boolean }
        likeCount: { type: number }
        dislikeCount: { type: number }
    PollOption:
      type: object
      required: [id, label, voteCount]
      properties:
        id: { type: string }
        label: { type: string }
        voteCount: { type: number }
    Poll:
      type: object
      required: [id, question, status, createdAt, totalVotes, options]
      properties:
        id: { type: string }
        question: { type: string }
        status:
          type: string
          enum: [open, closed]
        createdAt: { type: string }
        totalVotes: { type: number }
        selectedOptionId: { type: ["string", "null"] }
        options:
          type: array
          items:
            $ref: "#/components/schemas/PollOption"
    PollCreate:
      type: object
      required: [question, options]
      properties:
        question: { type: string, minLength: 3, maxLength: 240 }
        options:
          type: array
          minItems: 2
          maxItems: 6
          items: { type: string, minLength: 1, maxLength: 120 }
    PollStatusUpdate:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [open, closed]
    PollVote:
      type: object
      required: [optionId]
      properties:
        optionId: { type: string }
