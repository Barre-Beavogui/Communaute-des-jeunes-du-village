openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: profiles
    description: Community member profiles
  - name: moderation
    description: Admin moderation operations
  - name: membership
    description: Public membership requests
  - name: admin
    description: Administrator authentication
  - name: community
    description: Announcements, likes, polls, and member voting
  - name: member
    description: Community member authentication
  - name: chat
    description: Member group messages, voice notes, and live presence
  - name: direct-messages
    description: Private member-to-member messages
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /profiles:
    get:
      operationId: listProfiles
      tags: [profiles]
      summary: List approved community profiles
      responses:
        "200":
          description: Approved profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Profile"
  /profiles/{id}:
    get:
      operationId: getProfile
      tags: [profiles]
      summary: Get a profile by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "404":
          description: Profile not found
  /members/summary:
    get:
      operationId: getMembersSummary
      tags: [profiles]
      summary: Get lightweight community summary
      responses:
        "200":
          description: Community summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembersSummary"
  /membership-requests:
    post:
      operationId: createMembershipRequest
      tags: [membership]
      summary: Submit a membership request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MembershipRequestCreate"
      responses:
        "201":
          description: Membership request submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipRequestReceipt"
  /admin/login:
    post:
      operationId: adminLogin
      tags: [admin]
      summary: Open an administrator session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLogin"
      responses:
        "200":
          description: Administrator session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
        "401":
          description: Invalid password
  /member/login:
    post:
      operationId: memberLogin
      tags: [member]
      summary: Open a member session with an email or phone and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberLogin"
      responses:
        "200":
          description: Member session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberSession"
        "401":
          description: Invalid member credentials
  /member/activate:
    post:
      operationId: memberActivate
      tags: [member]
      summary: Start first-login activation with a personal code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberActivation"
      responses:
        "200":
          description: First-login session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberSession"
        "401":
          description: Invalid personal code
  /member/set-password:
    post:
      operationId: setMemberPassword
      tags: [member]
      summary: Set a member password during first login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberPasswordSetup"
      responses:
        "200":
          description: Password created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberPasswordSetupReceipt"
        "401":
          description: First-login session required
  /member/password-reset-requests:
    post:
      operationId: requestMemberPasswordReset
      tags: [member]
      summary: Request help resetting a forgotten member password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberPasswordResetRequestCreate"
      responses:
        "202":
          description: Request accepted without revealing whether the account exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberPasswordResetRequestReceipt"
  /member/profile:
    get:
      operationId: getMemberProfileSettings
      tags: [member]
      summary: Get the connected member profile settings
      responses:
        "200":
          description: Member profile settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberProfileSettings"
        "401":
          description: Member session required
    patch:
      operationId: updateMemberProfile
      tags: [member]
      summary: Update the connected member profile and contact visibility
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberProfileUpdate"
      responses:
        "200":
          description: Updated member profile settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberProfileSettings"
        "401":
          description: Member session required
        "409":
          description: Email or phone already used
  /chat/messages:
    get:
      operationId: listChatMessages
      tags: [chat]
      summary: List the latest member group messages
      responses:
        "200":
          description: Latest group messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChatMessage"
        "401":
          description: Member session required
    post:
      operationId: sendChatMessage
      tags: [chat]
      summary: Send a text message or a short voice note
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatMessageCreate"
      responses:
        "201":
          description: Message sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatMessage"
        "400":
          description: Invalid or unsupported message
        "401":
          description: Member session required
        "429":
          description: Too many messages
  /chat/presence:
    get:
      operationId: listChatPresence
      tags: [chat]
      summary: List members who are currently online or active
      responses:
        "200":
          description: Current member presence
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChatPresence"
        "401":
          description: Member session required
    post:
      operationId: updateChatPresence
      tags: [chat]
      summary: Update the connected member activity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatPresenceUpdate"
      responses:
        "200":
          description: Presence updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatPresenceReceipt"
        "401":
          description: Member session required
  /chat/unread:
    get:
      operationId: getChatUnreadCount
      tags: [chat]
      summary: Count unread group messages for the connected member
      responses:
        "200":
          description: Unread message count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatUnreadCount"
        "401":
          description: Member session required
  /chat/read:
    post:
      operationId: markChatRead
      tags: [chat]
      summary: Mark all current group messages as read
      responses:
        "200":
          description: Read position updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatReadReceipt"
        "401":
          description: Member session required
  /chat/messages/{id}/report:
    post:
      operationId: reportChatMessage
      tags: [chat]
      summary: Report a group message to administrators
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatMessageReportCreate"
      responses:
        "201":
          description: Report recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessReceipt"
        "401":
          description: Member session required
        "404":
          description: Message not found
  /direct-messages/conversations:
    get:
      operationId: listDirectMessageConversations
      tags: [direct-messages]
      summary: List the connected member direct-message conversations
      responses:
        "200":
          description: Direct-message conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DirectMessageConversation"
        "401":
          description: Member session required
  /direct-messages/unread:
    get:
      operationId: getDirectMessageUnreadCount
      tags: [direct-messages]
      summary: Count unread direct messages for the connected member
      responses:
        "200":
          description: Unread direct-message count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirectMessageUnreadCount"
        "401":
          description: Member session required
  /direct-messages/{profileId}:
    get:
      operationId: getDirectMessageThread
      tags: [direct-messages]
      summary: List direct messages exchanged with one member
      parameters:
        - name: profileId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Direct-message thread
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DirectMessage"
        "401":
          description: Member session required
        "404":
          description: Member not found
    post:
      operationId: sendDirectMessage
      tags: [direct-messages]
      summary: Send a private text message to one member
      parameters:
        - name: profileId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DirectMessageCreate"
      responses:
        "201":
          description: Direct message sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirectMessage"
        "400":
          description: Invalid message
        "401":
          description: Member session required
        "404":
          description: Member not found
        "429":
          description: Too many messages
  /direct-messages/{profileId}/read:
    post:
      operationId: markDirectMessageRead
      tags: [direct-messages]
      summary: Mark a direct-message conversation as read
      parameters:
        - name: profileId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Read position updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatReadReceipt"
        "401":
          description: Member session required
  /events:
    get:
      operationId: listEvents
      tags: [community]
      summary: List community meetings and events
      responses:
        "200":
          description: Community events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CommunityEvent"
        "401":
          description: Member session required
  /events/{id}/respond:
    post:
      operationId: respondToEvent
      tags: [community]
      summary: Confirm availability for a community event
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventResponseCreate"
      responses:
        "200":
          description: Updated event participation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityEvent"
        "401":
          description: Member session required
  /announcements:
    get:
      operationId: listAnnouncements
      tags: [community]
      summary: List community announcements
      responses:
        "200":
          description: Community announcements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Announcement"
  /announcements/{id}/like:
    post:
      operationId: toggleAnnouncementLike
      tags: [community]
      summary: Like or unlike an announcement as a member
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Updated like state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnnouncementReaction"
        "401":
          description: Member session required
  /announcements/{id}/dislike:
    post:
      operationId: toggleAnnouncementDislike
      tags: [community]
      summary: Dislike or remove a dislike from an announcement as a member
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Updated reaction state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnnouncementReaction"
        "401":
          description: Member session required
  /polls:
    get:
      operationId: listPolls
      tags: [community]
      summary: List community polls
      responses:
        "200":
          description: Community polls
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Poll"
  /polls/{id}/vote:
    post:
      operationId: votePoll
      tags: [community]
      summary: Vote in a poll as a member
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PollVote"
      responses:
        "200":
          description: Updated poll
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Poll"
        "401":
          description: Member session required
  /moderation/requests:
    get:
      operationId: listModerationRequests
      tags: [moderation]
      summary: List pending membership requests
      responses:
        "200":
          description: Pending requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MembershipRequest"
  /moderation/requests/{id}:
    patch:
      operationId: reviewModerationRequest
      tags: [moderation]
      summary: Approve or reject a membership request
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModerationReview"
      responses:
        "200":
          description: Reviewed request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipRequest"
  /moderation/password-reset-requests:
    get:
      operationId: listPasswordResetRequests
      tags: [moderation]
      summary: List pending member password reset requests
      responses:
        "200":
          description: Pending password reset requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MemberPasswordResetRequest"
  /moderation/password-reset-requests/{id}/code:
    post:
      operationId: createPasswordResetCode
      tags: [moderation]
      summary: Generate a new activation code for a password reset request
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Password reset invitation details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberPasswordResetCode"
        "404":
          description: Request not found
  /moderation/chat/messages:
    get:
      operationId: listModerationChatMessages
      tags: [moderation]
      summary: List the latest group messages for moderation
      responses:
        "200":
          description: Latest group messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChatMessage"
  /moderation/direct-messages:
    get:
      operationId: listModerationDirectMessages
      tags: [moderation]
      summary: List the latest private messages for administrator moderation
      responses:
        "200":
          description: Latest private messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DirectMessage"
  /moderation/chat/messages/{id}:
    delete:
      operationId: deleteModerationChatMessage
      tags: [moderation]
      summary: Permanently remove a group message
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Message removed
        "404":
          description: Message not found
  /moderation/chat/messages/{id}/pin:
    patch:
      operationId: updateModerationChatPin
      tags: [moderation]
      summary: Pin or unpin a group message
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatPinUpdate"
      responses:
        "200":
          description: Updated group message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatMessage"
        "404":
          description: Message not found
  /moderation/profiles/{id}:
    patch:
      operationId: updateModerationProfile
      tags: [moderation]
      summary: Update all editable information for a community profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminProfileUpdate"
      responses:
        "200":
          description: Updated community profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "404":
          description: Profile not found
        "409":
          description: Email or phone already used
    delete:
      operationId: deleteModerationProfile
      tags: [moderation]
      summary: Permanently remove a community profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Profile removed
        "404":
          description: Profile not found
  /moderation/profiles/{id}/visibility:
    patch:
      operationId: updateProfileVisibility
      tags: [moderation]
      summary: Choose which personal profile fields appear in the directory
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileVisibilityUpdate"
      responses:
        "200":
          description: Updated profile visibility
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "404":
          description: Profile not found
  /moderation/profiles/{id}/member-code:
    post:
      operationId: generateMemberCode
      tags: [moderation]
      summary: Create or replace a member personal code
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberContactUpdate"
      responses:
        "200":
          description: Newly generated personal code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberCode"
        "404":
          description: Profile not found
  /moderation/announcements:
    post:
      operationId: createAnnouncement
      tags: [moderation]
      summary: Publish an announcement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnnouncementCreate"
      responses:
        "201":
          description: Published announcement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Announcement"
  /moderation/announcements/{id}:
    delete:
      operationId: deleteAnnouncement
      tags: [moderation]
      summary: Delete an announcement
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Announcement removed
        "404":
          description: Announcement not found
  /moderation/polls:
    post:
      operationId: createPoll
      tags: [moderation]
      summary: Create a poll
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PollCreate"
      responses:
        "201":
          description: Created poll
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Poll"
  /moderation/polls/{id}:
    patch:
      operationId: updatePollStatus
      tags: [moderation]
      summary: Open or close a poll
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PollStatusUpdate"
      responses:
        "200":
          description: Updated poll
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Poll"
    delete:
      operationId: deletePoll
      tags: [moderation]
      summary: Delete a poll
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Poll removed
        "404":
          description: Poll not found
  /moderation/events:
    get:
      operationId: listModerationEvents
      tags: [moderation]
      summary: List community events for administrators
      responses:
        "200":
          description: Community events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CommunityEvent"
        "401":
          description: Administrator session required
    post:
      operationId: createEvent
      tags: [moderation]
      summary: Create a community meeting or event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommunityEventWrite"
      responses:
        "201":
          description: Created event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityEvent"
  /moderation/events/{id}:
    patch:
      operationId: updateEvent
      tags: [moderation]
      summary: Update an event and publish its report
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommunityEventWrite"
      responses:
        "200":
          description: Updated event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityEvent"
        "404":
          description: Event not found
    delete:
      operationId: deleteEvent
      tags: [moderation]
      summary: Delete an event and its responses
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Event removed
        "404":
          description: Event not found
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Profile:
      type: object
      required:
        [
          id,
          name,
          initials,
          neighborhood,
          bio,
          activities,
          privacy,
          status,
          showEmail,
          showPhone,
          showGender,
          showMaritalStatus,
          showEducationLevel,
        ]
      properties:
        id: { type: string }
        name: { type: string }
        initials: { type: string }
        neighborhood: { type: string }
        avatarUrl: { type: ["string", "null"] }
        bio: { type: string }
        activities:
          type: array
          items: { type: string }
        project: { type: ["string", "null"] }
        contact: { type: ["string", "null"] }
        email: { type: ["string", "null"] }
        phone: { type: ["string", "null"] }
        instagram: { type: ["string", "null"] }
        gender: { type: ["string", "null"] }
        maritalStatus: { type: ["string", "null"] }
        educationLevel: { type: ["string", "null"] }
        observations: { type: ["string", "null"] }
        emergencyContactName: { type: ["string", "null"] }
        emergencyContactPhone: { type: ["string", "null"] }
        fatherFirstNames: { type: ["string", "null"] }
        motherFullName: { type: ["string", "null"] }
        showEmail: { type: boolean }
        showPhone: { type: boolean }
        showGender: { type: boolean }
        showMaritalStatus: { type: boolean }
