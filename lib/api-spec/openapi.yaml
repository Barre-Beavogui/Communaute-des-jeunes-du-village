openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: profiles
    description: Community member profiles
  - name: moderation
    description: Admin moderation operations
  - name: membership
    description: Public membership requests
  - name: admin
    description: Administrator authentication
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /profiles:
    get:
      operationId: listProfiles
      tags: [profiles]
      summary: List approved community profiles
      responses:
        "200":
          description: Approved profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Profile"
  /profiles/{id}:
    get:
      operationId: getProfile
      tags: [profiles]
      summary: Get a profile by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "404":
          description: Profile not found
  /members/summary:
    get:
      operationId: getMembersSummary
      tags: [profiles]
      summary: Get lightweight community summary
      responses:
        "200":
          description: Community summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembersSummary"
  /membership-requests:
    post:
      operationId: createMembershipRequest
      tags: [membership]
      summary: Submit a membership request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MembershipRequestCreate"
      responses:
        "201":
          description: Membership request submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipRequestReceipt"
  /admin/login:
    post:
      operationId: adminLogin
      tags: [admin]
      summary: Open an administrator session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLogin"
      responses:
        "200":
          description: Administrator session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
        "401":
          description: Invalid password
  /moderation/requests:
    get:
      operationId: listModerationRequests
      tags: [moderation]
      summary: List pending membership requests
      responses:
        "200":
          description: Pending requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MembershipRequest"
  /moderation/requests/{id}:
    patch:
      operationId: reviewModerationRequest
      tags: [moderation]
      summary: Approve or reject a membership request
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModerationReview"
      responses:
        "200":
          description: Reviewed request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipRequest"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Profile:
      type: object
      required:
        [id, name, initials, neighborhood, bio, activities, privacy, status]
      properties:
        id: { type: string }
        name: { type: string }
        initials: { type: string }
        neighborhood: { type: string }
        avatarUrl: { type: ["string", "null"] }
        bio: { type: string }
        activities:
          type: array
          items: { type: string }
        project: { type: ["string", "null"] }
        contact: { type: ["string", "null"] }
        instagram: { type: ["string", "null"] }
        privacy:
          type: string
          enum: [community, private]
        status:
          type: string
          enum: [approved, pending]
    MembersSummary:
      type: object
      required: [totalMembers, activeProjects, topActivities]
      properties:
        totalMembers: { type: number }
        activeProjects: { type: number }
        topActivities:
          type: array
          items:
            type: object
            required: [label, count]
            properties:
              label: { type: string }
              count: { type: number }
    MembershipRequest:
      type: object
      required:
        [id, name, email, neighborhood, profession, bio, submittedAt, status]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        phone: { type: ["string", "null"] }
        neighborhood: { type: string }
        profession: { type: string }
        bio: { type: string }
        project: { type: ["string", "null"] }
        submittedAt: { type: string }
        status:
          type: string
          enum: [pending, approved, rejected]
    MembershipRequestCreate:
      type: object
      required: [name, email, neighborhood, profession, bio]
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        email: { type: string, maxLength: 254 }
        phone: { type: ["string", "null"], maxLength: 40 }
        neighborhood: { type: string, minLength: 2, maxLength: 120 }
        profession: { type: string, minLength: 2, maxLength: 80 }
        bio: { type: string, minLength: 10, maxLength: 500 }
        project: { type: ["string", "null"], maxLength: 500 }
    MembershipRequestReceipt:
      type: object
      required: [id, submittedAt, status]
      properties:
        id: { type: string }
        submittedAt: { type: string }
        status:
          type: string
          enum: [pending]
    AdminLogin:
      type: object
      required: [password]
      properties:
        password: { type: string, minLength: 1, maxLength: 200 }
    AdminSession:
      type: object
      required: [token, expiresAt]
      properties:
        token: { type: string }
        expiresAt: { type: string }
    ModerationReview:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [approved, rejected]
