databases:
  - name: communaute-zoboroma-db
    plan: free
    databaseName: zoboroma
    user: zoboroma

services:
  - type: web
    name: communaute-zoboroma-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: communaute-zoboroma-db
          property: connectionString
      - key: PUBLIC_WEB_ORIGINS
        value: https://barre-beavogui.github.io
      - key: PUBLIC_READ_ONLY
        value: "true"
