services:
  - type: web
    name: communaute-zoboroma-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/healthz
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: PUBLIC_WEB_ORIGINS
        value: https://barre-beavogui.github.io
      - key: PUBLIC_READ_ONLY
        value: "true"
