name: Vérification du site

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Vérifier le site public
        run: |
          curl --fail --location --silent --show-error \
            --retry 3 --retry-delay 5 --retry-all-errors --max-time 30 \
            https://www.zoboroma.online/ > /dev/null

      - name: Vérifier l’API
        run: |
          curl --fail --location --silent --show-error \
            --retry 3 --retry-delay 5 --retry-all-errors --max-time 30 \
            https://communaute-des-jeunes-du-village-ap.vercel.app/api/healthz > /dev/null
